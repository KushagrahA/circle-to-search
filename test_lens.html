<!DOCTYPE html>
<html>
<head>
    <title>Searching with Google Lens...</title>
    <style>
        body {
            background-color: #202124;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            border: 4px solid #3c4043;
            border-top: 4px solid #8ab4f8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Opening Google Lens...</h2>

    <form id="lensForm" action="https://lens.google.com/upload?ep=ccm&s=&st=" method="POST" enctype="multipart/form-data" style="display: none;">
        <input type="file" name="encoded_image" id="fileInput" />
    </form>

    <script>
        // A tiny 1x1 pixel base64 image for testing
        const b64 = "/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=";

        async function submitToLens() {
            try {
                // Convert base64 to Blob
                const res = await fetch("data:image/jpeg;base64," + b64);
                const blob = await res.blob();
                
                // Create a File object
                const file = new File([blob], "image.jpg", { type: "image/jpeg" });
                
                // Use DataTransfer to simulate file selection
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                
                // Attach to form and submit
                const fileInput = document.getElementById("fileInput");
                fileInput.files = dataTransfer.files;
                
                document.getElementById("lensForm").submit();
            } catch (err) {
                document.body.innerHTML = "Error: " + err.message;
            }
        }

        // Run immediately
        submitToLens();
    </script>
</body>
</html>
